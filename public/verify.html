<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ConsentGrid — Verify a consent receipt</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">ConsentGrid <small>Public verification</small></div>
    <nav><a href="/">Dashboard</a></nav>
  </div>

  <div class="wrap">
    <div class="card" style="max-width:620px;margin:0 auto">
      <h2>Verify a consent receipt</h2>
      <p class="sub">No account required. Paste an artifact ID from a consent receipt to independently confirm its cryptographic signature, notice version, and timestamp. No personal data is revealed.</p>
      <form id="verify-form" class="inline-actions" style="align-items:flex-end">
        <div style="flex:1"><label>Artifact ID</label><input id="verify-id" placeholder="artifact uuid" required /></div>
        <button class="btn" type="submit">Verify</button>
      </form>
      <div class="spacer"></div>
      <div id="verify-result"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
  <script>CG.initVerifyPage();</script>
</body>
</html>
